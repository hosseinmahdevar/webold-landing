name: webold-landing

services:
  webold:
    image: ${APP_IMAGE}
    container_name: webold-landing
    restart: unless-stopped
    # پورت مستقیم حذف می‌شود تا فقط از طریق Traefik در دسترس باشد
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - traefik_network # همان شبکه‌ای که ترافیک روی آن ران شده
    labels:
      - "traefik.enable=true"
      # دامنه سایت را اینجا قرار دهید:
      - "traefik.http.routers.webold.rule=Host(`webold.ir`)"
      - "traefik.http.routers.webold.entrypoints=websecure"
      # در صورت استفاده از Let's Encrypt / CertResolver در ترافیک (نام resolver خود را جایگزین کنید):
      - "traefik.http.routers.webold.tls=true"
      - "traefik.http.routers.webold.tls.certresolver=letsencrypt"
      # پورتی که اپلیکیشن داخل کانتینر گوش می‌دهد:
      - "traefik.http.services.webold.loadbalancer.server.port=3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik_network:
    external: true
    # اگر اسم شبکه ترافیک در VPS چیز دیگری است (مثلاً traefik-public یا web):
    name: proxy
